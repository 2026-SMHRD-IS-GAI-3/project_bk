<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>방구석 검도 - 상점</title>

  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'Gowun Batang', serif;
      background-color: #a7bcbb;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      font: inherit;
    }

    .mobile-frame {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      min-height: 720px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(145deg, #dce8e5 0%, #bfd1cf 50%, #96aeb0 100%);
      color: #213638;
    }

    .purchase-page {
      height: 100%;
      padding: 28px 22px 116px;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .purchase-page::-webkit-scrollbar {
      display: none;
    }

    .point-panel {
      min-height: 132px;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(23, 35, 42, 0.90), rgba(61, 91, 88, 0.76)),
        url("../Project_Logo/logo_02.png") center/cover;
      overflow: hidden;
      position: relative;
      padding: 20px;
      color: #f6fbf8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 22px 42px rgba(34, 58, 60, 0.20);
    }

    .point-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(10, 18, 24, 0.84), rgba(10, 18, 24, 0.14));
    }

    .point-content {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .point-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .point-label {
      font-size: 27px;
      line-height: 1.18;
      font-weight: 700;
      color: #f6fbf8;
      margin: 0;
      letter-spacing: 0;
      text-align: left;
    }

    .point-value {
      min-width: 94px;
      min-height: 50px;
      border-radius: 8px;
      background-color: rgba(246, 251, 248, 0.18);
      border: 1px solid rgba(246, 251, 248, 0.26);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      font-family: 'Pretendard', sans-serif;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0;
      flex-shrink: 0;
    }

    .point-caption {
      display: block;
      margin-bottom: 6px;
      font-size: 9px;
      font-weight: 800;
      color: rgba(246, 251, 248, 0.66);
      line-height: 1;
      white-space: nowrap;
    }

    .point-amount {
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
    }

    .point-unit {
      font-size: 12px;
      margin-left: 4px;
      color: #d8e87f;
    }

    .section-title {
      font-family: 'Pretendard', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #213638;
      margin: 22px 0 10px;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      min-height: 88px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.56);
      box-shadow: 0 12px 24px rgba(40, 70, 72, 0.10);
      padding: 13px;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      font-family: 'Pretendard', sans-serif;
    }

    .item-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background-color: rgb(7, 11, 29);
      color: #f6fbf8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-icon svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .item-kind {
      display: inline-flex;
      height: 18px;
      align-items: center;
      margin-bottom: 5px;
      padding: 0 7px;
      border-radius: 999px;
      background-color: rgba(68, 103, 107, 0.12);
      color: rgba(33, 54, 56, 0.62);
      font-size: 9px;
      font-weight: 800;
    }

    .item-name {
      font-size: 14px;
      font-weight: 800;
      color: #213638;
      margin-bottom: 4px;
    }

    .item-desc {
      font-size: 10px;
      font-weight: 700;
      color: rgba(33, 54, 56, 0.56);
      line-height: 1.4;
      word-break: keep-all;
    }

    .buy-btn {
      min-width: 66px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background-color: #213638;
      color: #f6fbf8;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .buy-price {
      display: block;
      font-size: 10px;
      color: rgba(246, 251, 248, 0.68);
      line-height: 1;
      margin-top: 2px;
    }

    .buy-btn:disabled {
      cursor: default;
      background-color: rgba(33, 54, 56, 0.13);
      color: rgba(33, 54, 56, 0.42);
    }

    .buy-btn:disabled .buy-price {
      color: rgba(33, 54, 56, 0.36);
    }

    .bottom-nav {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      height: 78px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 26px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      box-shadow: 0 18px 36px rgba(40, 70, 72, 0.18);
      backdrop-filter: blur(10px);
    }

    .nav-item {
      width: 25%;
      height: 100%;
      text-decoration: none;
      color: rgba(33, 54, 56, 0.52);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      font-family: 'Pretendard', sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .icon-box {
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-icon {
      width: 27px;
      height: 27px;
      stroke: rgba(33, 54, 56, 0.52);
      stroke-width: 1.8;
      fill: none;
    }

    .nav-item.active {
      color: #213638;
    }

    .nav-item.active .icon-box {
      width: 46px;
      height: 46px;
      border: 2px solid khaki;
      border-radius: 16px;
      background-color: rgba(255, 255, 255, 0.78);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1px;
      box-shadow: 0 8px 18px rgba(177, 197, 77, 0.18);
    }

    .nav-item.active .nav-icon {
      stroke: #213638;
    }

    @media (max-width: 390px) {
      .purchase-page {
        padding: 24px 18px 108px;
      }

      .point-value {
        min-width: 88px;
        min-height: 48px;
      }

      .point-label {
        font-size: 25px;
      }

      .item-card {
        grid-template-columns: 44px 1fr auto;
        gap: 10px;
      }

      .bottom-nav {
        left: 14px;
        right: 14px;
        bottom: 14px;
        height: 76px;
        border-radius: 24px;
      }

      .nav-item {
        font-size: 9px;
      }

      .nav-icon {
        width: 25px;
        height: 25px;
      }

      .nav-item.active .icon-box {
        width: 43px;
        height: 43px;
      }
    }

    @media (min-width: 431px) {
      .mobile-frame {
        height: 860px;
        max-height: 94vh;
        min-height: 720px;
        border-radius: 32px;
        box-shadow: 0 30px 80px rgba(28, 55, 58, 0.24);
      }
    }
  </style>
</head>

<body>
  <div class="mobile-frame">
    <main class="purchase-page">
      <section class="point-panel" aria-label="나의 포인트">
        <div class="point-content">
          <div class="point-head">
            <h1 class="point-label">포인트 마켓</h1>
            <p class="point-value">
              <span class="point-caption">가용 포인트</span>
              <span class="point-amount"><span id="memberPoint">0</span><span class="point-unit">P</span></span>
            </p>
          </div>
        </div>
      </section>

      <section aria-label="상점 아이템">
        <h1 class="section-title">상품목록</h1>
        <div class="item-list" id="itemList"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="main.html" class="nav-item">
        <div class="icon-box">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M4 20L20 4"></path>
            <path d="M14 4L20 10"></path>
            <path d="M4 14L10 20"></path>
            <path d="M8 16L6 18"></path>
            <path d="M16 8L18 6"></path>
          </svg>
        </div>
        <span>훈련</span>
      </a>

      <a href="challenge.html" class="nav-item">
        <div class="icon-box">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M8 4H16V8C16 11 14 13 12 13C10 13 8 11 8 8V4Z"></path>
            <path d="M6 6H4C4 10 6 12 9 12"></path>
            <path d="M18 6H20C20 10 18 12 15 12"></path>
            <path d="M12 13V18"></path>
            <path d="M9 20H15"></path>
          </svg>
        </div>
        <span>도전과제</span>
      </a>

      <a href="purchase.html" class="nav-item active">
        <div class="icon-box">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M6 6H21L19 14H8L6 6Z"></path>
            <path d="M6 6L5 3H2"></path>
            <circle cx="9" cy="19" r="1.5"></circle>
            <circle cx="18" cy="19" r="1.5"></circle>
          </svg>
        </div>
        <span>상점</span>
      </a>

      <a href="mypage.html" class="nav-item">
        <div class="icon-box">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M5 21C5 17 8 14 12 14C16 14 19 17 19 21"></path>
          </svg>
        </div>
        <span>마이페이지</span>
      </a>
    </nav>
  </div>

  <script>
    const M_NUM = 1;
    const POINT_STORAGE_KEY = `BGS_MEMBER_POINT_${M_NUM}`;
    const ITEM_STORAGE_KEY = `BGS_MEMBER_ITEMS_${M_NUM}`;

    const ITEM_LIST = [
      { ITEM_NUM: 1, ITEM_TYPE: "TITLE", ITEM_ICON: "rookie", ITEM_KIND: "칭호", ITEM_NAME: "견습 기사", ITEM_DESC: "첫 수련 기록에 어울리는 담백한 이름표입니다.", PRICE: 100 },
      { ITEM_NUM: 2, ITEM_TYPE: "TITLE", ITEM_ICON: "sword", ITEM_KIND: "칭호", ITEM_NAME: "초심의 검", ITEM_DESC: "처음의 마음을 잊지 않는 수련자에게.", PRICE: 150 },
      { ITEM_NUM: 3, ITEM_TYPE: "TITLE", ITEM_ICON: "stance", ITEM_KIND: "칭호", ITEM_NAME: "고요한 중단", ITEM_DESC: "흔들림 없는 기본 자세를 좋아한다면.", PRICE: 250 },
      { ITEM_NUM: 4, ITEM_TYPE: "TITLE", ITEM_ICON: "flame", ITEM_KIND: "칭호", ITEM_NAME: "한 판 더", ITEM_DESC: "오늘도 조금 더 버틴 사람에게 남는 말.", PRICE: 300 },
      { ITEM_NUM: 5, ITEM_TYPE: "PROFILE", ITEM_ICON: "armor", ITEM_KIND: "프로필", ITEM_NAME: "청록 호구", ITEM_DESC: "차분한 청록빛 장비 무드의 프로필 장식.", PRICE: 400 },
      { ITEM_NUM: 6, ITEM_TYPE: "PROFILE", ITEM_ICON: "shadow", ITEM_KIND: "프로필", ITEM_NAME: "목검 그림자", ITEM_DESC: "검의 실루엣만 남긴 단정한 프로필 장식.", PRICE: 450 }
    ];

    function getMemberPoint() {
      return Number(localStorage.getItem(POINT_STORAGE_KEY)) || 0;
    }

    function setMemberPoint(point) {
      localStorage.setItem(POINT_STORAGE_KEY, String(point));
      renderMemberPoint();
      renderItemList();
    }

    function getMemberItems() {
      const savedItems = localStorage.getItem(ITEM_STORAGE_KEY);

      if (!savedItems) {
        return [];
      }

      try {
        return JSON.parse(savedItems);
      } catch (error) {
        return [];
      }
    }

    function saveMemberItems(items) {
      localStorage.setItem(ITEM_STORAGE_KEY, JSON.stringify(items));
    }

    function renderMemberPoint() {
      document.getElementById("memberPoint").innerText = getMemberPoint();
    }

    function getItemIcon(iconName) {
      if (iconName === "sword") {
        return `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20L20 4"></path>
            <path d="M14 4L20 10"></path>
            <path d="M4 14L10 20"></path>
            <path d="M8 16L6 18"></path>
          </svg>
        `;
      }

      if (iconName === "stance") {
        return `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="6" r="2.3"></circle>
            <path d="M12 8.5V14"></path>
            <path d="M8 11H16"></path>
            <path d="M12 14L8.5 20"></path>
            <path d="M12 14L15.5 20"></path>
          </svg>
        `;
      }

      if (iconName === "flame") {
        return `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21C8.8 21 6 18.7 6 15.1C6 12.4 7.7 10.7 9.4 9C10.8 7.6 12 6.2 12 4C15.5 6.1 18 9.4 18 13.5C18 18 15.3 21 12 21Z"></path>
            <path d="M11 20C9.8 18.8 10 17 11.3 15.6C12.2 14.6 12.8 13.7 12.8 12.5C14.4 13.7 15.2 15.2 15.2 17C15.2 19 13.8 20.5 12 21"></path>
          </svg>
        `;
      }

      if (iconName === "armor") {
        return `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5H17L19 9V17C19 19.2 16 21 12 21C8 21 5 19.2 5 17V9L7 5Z"></path>
            <path d="M8 10H16"></path>
            <path d="M9 14H15"></path>
            <path d="M12 5V21"></path>
          </svg>
        `;
      }

      if (iconName === "shadow") {
        return `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19L19 5"></path>
            <path d="M15 5H19V9"></path>
            <path d="M4 21H13"></path>
            <path d="M8 17L11 20"></path>
          </svg>
        `;
      }

      return `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 4H16V8C16 11 14 13 12 13C10 13 8 11 8 8V4Z"></path>
          <path d="M6 6H4C4 10 6 12 9 12"></path>
          <path d="M18 6H20C20 10 18 12 15 12"></path>
          <path d="M12 13V18"></path>
          <path d="M9 20H15"></path>
        </svg>
      `;
    }

    function renderItemList() {
      const itemList = document.getElementById("itemList");
      const memberPoint = getMemberPoint();
      const memberItems = getMemberItems();

      itemList.innerHTML = ITEM_LIST.map((item) => `
        <article class="item-card">
          <div class="item-icon">${getItemIcon(item.ITEM_ICON)}</div>
          <div>
            <span class="item-kind">${item.ITEM_KIND}</span>
            <h2 class="item-name">${item.ITEM_NAME}</h2>
            <p class="item-desc">${item.ITEM_DESC}</p>
          </div>
          <button
            type="button"
            class="buy-btn"
            data-item-num="${item.ITEM_NUM}"
            ${memberPoint < item.PRICE || memberItems.includes(item.ITEM_NUM) ? "disabled" : ""}
          >${memberItems.includes(item.ITEM_NUM) ? "보유" : "구매"}<span class="buy-price">${item.PRICE}P</span></button>
        </article>
      `).join("");

      document.querySelectorAll(".buy-btn:not(:disabled)").forEach((button) => {
        button.addEventListener("click", () => {
          buyItem(Number(button.dataset.itemNum));
        });
      });
    }

    function buyItem(itemNum) {
      const selectedItem = ITEM_LIST.find((item) => item.ITEM_NUM === itemNum);

      if (!selectedItem || getMemberPoint() < selectedItem.PRICE) {
        return;
      }

      const memberItems = getMemberItems();

      if (memberItems.includes(selectedItem.ITEM_NUM)) {
        return;
      }

      saveMemberItems([...memberItems, selectedItem.ITEM_NUM]);
      setMemberPoint(getMemberPoint() - selectedItem.PRICE);
    }

    renderMemberPoint();
    renderItemList();
  </script>
</body>
</html>
