<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>방구석 검도 - 마이페이지</title>

  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'Gowun Batang', serif;
      background-color: #a7bcbb;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button,
    select {
      font: inherit;
    }

    .mobile-frame {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      min-height: 720px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(145deg, #dce8e5 0%, #bfd1cf 50%, #96aeb0 100%);
      color: #213638;
    }

    .mypage {
      height: 100%;
      padding: 28px 22px 116px;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .mypage::-webkit-scrollbar {
      display: none;
    }

    .profile-panel {
      min-height: 174px;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(23, 35, 42, 0.90), rgba(61, 91, 88, 0.76)),
        url("../Project_Logo/logo_02.png") center/cover;
      overflow: hidden;
      position: relative;
      padding: 20px;
      color: #f6fbf8;
      display: flex;
      align-items: center;
      margin-bottom: 22px;
      box-shadow: 0 22px 42px rgba(34, 58, 60, 0.20);
    }

    .profile-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(10, 18, 24, 0.84), rgba(10, 18, 24, 0.16));
    }

    .profile-content {
      position: relative;
      z-index: 1;
      width: 100%;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 16px;
      align-items: center;
    }

    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background-color: rgb(7, 11, 29);
      border: 1px solid rgba(246, 251, 248, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f6fbf8;
      box-shadow: 0 14px 24px rgba(6, 14, 18, 0.24);
    }

    .profile-avatar svg {
      width: 38px;
      height: 38px;
      stroke: currentColor;
      stroke-width: 1.9;
      fill: none;
    }

    .profile-title {
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      background-color: rgba(216, 232, 127, 0.16);
      border: 1px solid rgba(216, 232, 127, 0.26);
      color: #d8e87f;
      font-family: 'Pretendard', sans-serif;
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .profile-name {
      font-size: 25px;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .profile-meta {
      font-family: 'Pretendard', sans-serif;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.5;
      color: rgba(246, 251, 248, 0.76);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .stat-item {
      min-height: 74px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      background-color: rgba(255, 255, 255, 0.54);
      box-shadow: 0 12px 24px rgba(40, 70, 72, 0.10);
      padding: 12px 8px;
      text-align: center;
      font-family: 'Pretendard', sans-serif;
    }

    .stat-value {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: #213638;
      line-height: 1.1;
    }

    .stat-label {
      display: block;
      margin-top: 8px;
      font-size: 10px;
      font-weight: 800;
      color: rgba(33, 54, 56, 0.58);
      word-break: keep-all;
    }

    .section-title {
      font-family: 'Pretendard', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #213638;
      margin: 22px 0 10px;
    }

    .setting-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .setting-card {
      min-height: 62px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.56);
      box-shadow: 0 12px 24px rgba(40, 70, 72, 0.10);
      padding: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: 'Pretendard', sans-serif;
    }

    .setting-info {
      min-width: 0;
    }

    .setting-name {
      font-size: 13px;
      font-weight: 800;
      color: #213638;
      margin-bottom: 4px;
    }

    .setting-desc {
      font-size: 10px;
      font-weight: 700;
      color: rgba(33, 54, 56, 0.56);
      line-height: 1.4;
      word-break: keep-all;
    }

    .select-control {
      width: 122px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background-color: rgba(33, 54, 56, 0.10);
      color: #213638;
      padding: 0 10px;
      font-family: 'Pretendard', sans-serif;
      font-size: 11px;
      font-weight: 800;
      outline: none;
      flex-shrink: 0;
    }

    .toggle {
      width: 48px;
      height: 28px;
      border: none;
      border-radius: 999px;
      background-color: rgba(33, 54, 56, 0.16);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: 0.18s;
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: #ffffff;
      box-shadow: 0 4px 10px rgba(33, 54, 56, 0.18);
      transition: 0.18s;
    }

    .toggle.active {
      background-color: rgb(7, 11, 29);
    }

    .toggle.active::after {
      transform: translateX(20px);
    }

    .bottom-nav {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      height: 78px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 26px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      box-shadow: 0 18px 36px rgba(40, 70, 72, 0.18);
      backdrop-filter: blur(10px);
    }

    .nav-item {
      width: 25%;
      height: 100%;
      text-decoration: none;
      color: rgba(33, 54, 56, 0.52);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      font-family: 'Pretendard', sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .icon-box {
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-icon {
      width: 27px;
      height: 27px;
      stroke: rgba(33, 54, 56, 0.52);
      stroke-width: 1.8;
      fill: none;
    }

    .nav-item.active {
      color: #213638;
    }

    .nav-item.active .icon-box {
      width: 46px;
      height: 46px;
      border: 2px solid khaki;
      border-radius: 16px;
      background-color: rgba(255, 255, 255, 0.78);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1px;
      box-shadow: 0 8px 18px rgba(177, 197, 77, 0.18);
    }

    .nav-item.active .nav-icon {
      stroke: #213638;
    }

    @media (max-width: 390px) {
      .mypage {
        padding: 24px 18px 108px;
      }

      .profile-content {
        grid-template-columns: 64px 1fr;
        gap: 14px;
      }

      .profile-avatar {
        width: 64px;
        height: 64px;
        border-radius: 20px;
      }

      .profile-name {
        font-size: 23px;
      }

      .select-control {
        width: 112px;
      }

      .bottom-nav {
        left: 14px;
        right: 14px;
        bottom: 14px;
        height: 76px;
        border-radius: 24px;
      }

      .nav-item {
        font-size: 9px;
      }

      .nav-icon {
        width: 25px;
        height: 25px;
      }

      .nav-item.active .icon-box {
        width: 43px;
        height: 43px;
      }
    }

    @media (min-width: 431px) {
      .mobile-frame {
        height: 860px;
        max-height: 94vh;
        min-height: 720px;
        border-radius: 32px;
        box-shadow: 0 30px 80px rgba(28, 55, 58, 0.24);
      }
    }
  </style>
</head>

<body>
  <div class="mobile-frame">
    <main class="mypage">
      <section class="profile-panel" aria-label="회원 프로필">
        <div class="profile-content">
          <div class="profile-avatar" id="profileAvatar"></div>
          <div>
            <span class="profile-title" id="equippedTitle">초심의 검</span>
            <h1 class="profile-name" id="memberName">수련생</h1>
            <p class="profile-meta">오늘도 자세를 세우는 중입니다.</p>
          </div>
        </div>
      </section>

      <section class="stat-grid" aria-label="회원 요약">
        <div class="stat-item">
          <span class="stat-value" id="memberPoint">0P</span>
          <span class="stat-label">보유 포인트</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="ownedTitleCount">0</span>
          <span class="stat-label">보유 칭호</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="ownedProfileCount">0</span>
          <span class="stat-label">프로필 장식</span>
        </div>
      </section>

      <section aria-label="프로필 설정">
        <h2 class="section-title">프로필 설정</h2>
        <div class="setting-list">
          <article class="setting-card">
            <div class="setting-info">
              <h3 class="setting-name">칭호</h3>
              <p class="setting-desc">상점에서 구매한 칭호를 장착합니다.</p>
            </div>
            <select class="select-control" id="titleSelect"></select>
          </article>

          <article class="setting-card">
            <div class="setting-info">
              <h3 class="setting-name">프로필 이미지</h3>
              <p class="setting-desc">구매한 프로필 장식을 적용합니다.</p>
            </div>
            <select class="select-control" id="profileSelect"></select>
          </article>
        </div>
      </section>

      <section aria-label="환경설정">
        <h2 class="section-title">환경설정</h2>
        <div class="setting-list">
          <article class="setting-card">
            <div class="setting-info">
              <h3 class="setting-name">카메라 가이드</h3>
              <p class="setting-desc">훈련 화면에서 자세 안내선을 표시합니다.</p>
            </div>
            <button type="button" class="toggle" data-setting="CAMERA_GUIDE" aria-label="카메라 가이드"></button>
          </article>

          <article class="setting-card">
            <div class="setting-info">
              <h3 class="setting-name">효과음</h3>
              <p class="setting-desc">완료와 보상 수령 시 짧은 알림음을 사용합니다.</p>
            </div>
            <button type="button" class="toggle" data-setting="SOUND_ON" aria-label="효과음"></button>
          </article>

          <article class="setting-card">
            <div class="setting-info">
              <h3 class="setting-name">훈련 알림</h3>
              <p class="setting-desc">오늘의 훈련을 잊지 않도록 알림을 준비합니다.</p>
            </div>
            <button type="button" class="toggle" data-setting="TRAIN_NOTICE" aria-label="훈련 알림"></button>
          </article>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="main.html" class="nav-item">
        <div class="icon-box">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M4 20L20 4"></path>
            <path d="M14 4L20 10"></path>
            <path d="M4 14L10 20"></path>
            <path d="M8 16L6 18"></path>
            <path d="M16 8L18 6"></path>
          </svg>
        </div>
        <span>훈련</span>
      </a>

      <a href="challenge.html" class="nav-item">
        <div class="icon-box">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M8 4H16V8C16 11 14 13 12 13C10 13 8 11 8 8V4Z"></path>
            <path d="M6 6H4C4 10 6 12 9 12"></path>
            <path d="M18 6H20C20 10 18 12 15 12"></path>
            <path d="M12 13V18"></path>
            <path d="M9 20H15"></path>
          </svg>
        </div>
        <span>도전과제</span>
      </a>

      <a href="purchase.html" class="nav-item">
        <div class="icon-box">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M6 6H21L19 14H8L6 6Z"></path>
            <path d="M6 6L5 3H2"></path>
            <circle cx="9" cy="19" r="1.5"></circle>
            <circle cx="18" cy="19" r="1.5"></circle>
          </svg>
        </div>
        <span>상점</span>
      </a>

      <a href="mypage.html" class="nav-item active">
        <div class="icon-box">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M5 21C5 17 8 14 12 14C16 14 19 17 19 21"></path>
          </svg>
        </div>
        <span>마이페이지</span>
      </a>
    </nav>
  </div>

  <script>
    const M_NUM = 1;
    const POINT_STORAGE_KEY = `BGS_MEMBER_POINT_${M_NUM}`;
    const ITEM_STORAGE_KEY = `BGS_MEMBER_ITEMS_${M_NUM}`;
    const PROFILE_SETTING_KEY = `BGS_PROFILE_SETTING_${M_NUM}`;
    const APP_SETTING_KEY = `BGS_APP_SETTING_${M_NUM}`;

    const ITEM_LIST = [
      { ITEM_NUM: 1, ITEM_TYPE: "TITLE", ITEM_ICON: "rookie", ITEM_NAME: "견습 기사" },
      { ITEM_NUM: 2, ITEM_TYPE: "TITLE", ITEM_ICON: "sword", ITEM_NAME: "초심의 검" },
      { ITEM_NUM: 3, ITEM_TYPE: "TITLE", ITEM_ICON: "stance", ITEM_NAME: "고요한 중단" },
      { ITEM_NUM: 4, ITEM_TYPE: "TITLE", ITEM_ICON: "flame", ITEM_NAME: "한 판 더" },
      { ITEM_NUM: 5, ITEM_TYPE: "PROFILE", ITEM_ICON: "armor", ITEM_NAME: "청록 호구" },
      { ITEM_NUM: 6, ITEM_TYPE: "PROFILE", ITEM_ICON: "shadow", ITEM_NAME: "목검 그림자" }
    ];

    const DEFAULT_PROFILE_SETTING = {
      TITLE_ITEM_NUM: 2,
      PROFILE_ITEM_NUM: 0
    };

    const DEFAULT_APP_SETTING = {
      CAMERA_GUIDE: true,
      SOUND_ON: true,
      TRAIN_NOTICE: false
    };

    function getMemberPoint() {
      return Number(localStorage.getItem(POINT_STORAGE_KEY)) || 0;
    }

    function getMemberItems() {
      const savedItems = localStorage.getItem(ITEM_STORAGE_KEY);

      if (!savedItems) {
        return [];
      }

      try {
        return JSON.parse(savedItems);
      } catch (error) {
        return [];
      }
    }

    function loadJson(key, fallback) {
      const savedValue = localStorage.getItem(key);

      if (!savedValue) {
        return { ...fallback };
      }

      try {
        return { ...fallback, ...JSON.parse(savedValue) };
      } catch (error) {
        return { ...fallback };
      }
    }

    function saveJson(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getAvatarIcon(iconName) {
      if (iconName === "armor") {
        return `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5H17L19 9V17C19 19.2 16 21 12 21C8 21 5 19.2 5 17V9L7 5Z"></path>
            <path d="M8 10H16"></path>
            <path d="M9 14H15"></path>
            <path d="M12 5V21"></path>
          </svg>
        `;
      }

      if (iconName === "shadow") {
        return `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19L19 5"></path>
            <path d="M15 5H19V9"></path>
            <path d="M4 21H13"></path>
            <path d="M8 17L11 20"></path>
          </svg>
        `;
      }

      return `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M5 21C5 17 8 14 12 14C16 14 19 17 19 21"></path>
        </svg>
      `;
    }

    function getOwnedItemsByType(type) {
      const memberItems = getMemberItems();
      return ITEM_LIST.filter((item) => item.ITEM_TYPE === type && memberItems.includes(item.ITEM_NUM));
    }

    function renderProfile() {
      const profileSetting = loadJson(PROFILE_SETTING_KEY, DEFAULT_PROFILE_SETTING);
      const titleItem = ITEM_LIST.find((item) => item.ITEM_NUM === Number(profileSetting.TITLE_ITEM_NUM));
      const profileItem = ITEM_LIST.find((item) => item.ITEM_NUM === Number(profileSetting.PROFILE_ITEM_NUM));

      document.getElementById("equippedTitle").innerText = titleItem ? titleItem.ITEM_NAME : "초심의 검";
      document.getElementById("profileAvatar").innerHTML = getAvatarIcon(profileItem ? profileItem.ITEM_ICON : "default");
    }

    function renderStats() {
      document.getElementById("memberPoint").innerText = `${getMemberPoint()}P`;
      document.getElementById("ownedTitleCount").innerText = getOwnedItemsByType("TITLE").length;
      document.getElementById("ownedProfileCount").innerText = getOwnedItemsByType("PROFILE").length;
    }

    function renderProfileControls() {
      const profileSetting = loadJson(PROFILE_SETTING_KEY, DEFAULT_PROFILE_SETTING);
      const titleSelect = document.getElementById("titleSelect");
      const profileSelect = document.getElementById("profileSelect");
      const titleItems = getOwnedItemsByType("TITLE");
      const profileItems = getOwnedItemsByType("PROFILE");

      titleSelect.innerHTML = [
        { ITEM_NUM: 0, ITEM_NAME: "기본 칭호" },
        ...titleItems
      ].map((item) => `
        <option value="${item.ITEM_NUM}" ${Number(profileSetting.TITLE_ITEM_NUM) === item.ITEM_NUM ? "selected" : ""}>${item.ITEM_NAME}</option>
      `).join("");

      profileSelect.innerHTML = [
        { ITEM_NUM: 0, ITEM_NAME: "기본 프로필" },
        ...profileItems
      ].map((item) => `
        <option value="${item.ITEM_NUM}" ${Number(profileSetting.PROFILE_ITEM_NUM) === item.ITEM_NUM ? "selected" : ""}>${item.ITEM_NAME}</option>
      `).join("");

      titleSelect.addEventListener("change", () => {
        const nextSetting = loadJson(PROFILE_SETTING_KEY, DEFAULT_PROFILE_SETTING);
        nextSetting.TITLE_ITEM_NUM = Number(titleSelect.value);
        saveJson(PROFILE_SETTING_KEY, nextSetting);
        renderProfile();
      });

      profileSelect.addEventListener("change", () => {
        const nextSetting = loadJson(PROFILE_SETTING_KEY, DEFAULT_PROFILE_SETTING);
        nextSetting.PROFILE_ITEM_NUM = Number(profileSelect.value);
        saveJson(PROFILE_SETTING_KEY, nextSetting);
        renderProfile();
      });
    }

    function renderAppSettings() {
      const appSetting = loadJson(APP_SETTING_KEY, DEFAULT_APP_SETTING);

      document.querySelectorAll(".toggle").forEach((toggle) => {
        const settingName = toggle.dataset.setting;
        toggle.classList.toggle("active", Boolean(appSetting[settingName]));

        toggle.addEventListener("click", () => {
          const nextSetting = loadJson(APP_SETTING_KEY, DEFAULT_APP_SETTING);
          nextSetting[settingName] = !nextSetting[settingName];
          saveJson(APP_SETTING_KEY, nextSetting);
          toggle.classList.toggle("active", nextSetting[settingName]);
        });
      });
    }

    renderProfile();
    renderStats();
    renderProfileControls();
    renderAppSettings();
  </script>
</body>
</html>
